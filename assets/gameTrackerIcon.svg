    <!-- Controller body -->
    <path d="M -30 -8 Q -35 -12 -35 -4 L -35 8 Q -35 12 -30 8 L -20 2 L -20 -2 Z" fill="white" opacity="0.9"/>
    <path d="M 30 -8 Q 35 -12 35 -4 L 35 8 Q 35 12 30 8 L 20 2 L 20 -2 Z" fill="white" opacity="0.9"/>
    
    <!-- D-pad (left side) -->
    <rect x="-22" y="-8" width="4" height="4" fill="white" opacity="0.85"/>
    <rect x="-22" y="0" width="4" height="4" fill="white" opacity="0.85"/>
    <rect x="-18" y="-4" width="4" height="4" fill="white" opacity="0.85"/>
    <rect x="-26" y="-4" width="4" height="4" fill="white" opacity="0.85"/>
    
    <!-- Buttons (right side) -->
    <circle cx="18" cy="-6" r="3" fill="white" opacity="0.85"/>
    <circle cx="24" cy="-2" r="3" fill="white" opacity="0.85"/>
    <circle cx="18" cy="2" r="3" fill="white" opacity="0.85"/>
    <circle cx="12" cy="-2" r="3" fill="white" opacity="0.85"/>
  </g>
</svg>